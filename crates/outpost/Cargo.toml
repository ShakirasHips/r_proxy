[package]
name = "outpost"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
http = "1.5.0"
serde = { version = "1.0.229", features = ["derive"] }
tokio = "1.53.1"
tower-http = { version = "0.7.0", features = ["trace"] }
tracing-subscriber = "0.3.23"
tracing = "0.1.44"
routes = "0.1.0"
chrono = { version = "0.4", features = ["serde"] }
proxy = { path = "../proxy" }
serde_json = "1.0.151"